<!doctype html><html><head><meta charset="utf-8"><meta name="author" content="Yazad Madan"><title>Synthetic Lever form</title></head><body>
<h1>Application</h1>
<form id="synthetic-lever" novalidate><ul>
<li class="application-question"><label><div class="application-label">Full name</div><input id="name" name="name" required></label></li>
<li class="application-question"><label><div class="application-label">Email</div><input id="email" name="email" type="email" required></label></li>
<li class="application-question"><div class="application-label">Additional information</div><textarea id="notes" name="comments"></textarea></li>
<li class="application-question"><div class="application-label">Are you authorized to work here?</div>
<label><input type="radio" name="auth" value="Yes"> Yes</label><label><input type="radio" name="auth" value="No"> No</label></li>
<li class="application-question"><label><input type="checkbox" id="updates" name="updates"> Send me updates</label></li>
<li class="application-question"><label><div class="application-label">Resume</div><input id="resume" name="resume" type="file"></label></li>
</ul><button type="button" id="submit-application">Submit application</button></form>
</body></html>
