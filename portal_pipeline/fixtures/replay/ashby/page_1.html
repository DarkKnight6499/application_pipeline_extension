<!doctype html><html><head><meta charset="utf-8"><meta name="author" content="Yazad Madan"><title>Synthetic Ashby form</title></head><body>
<h1>Application</h1>
<form id="synthetic-ashby" novalidate>
<label>Full name<input id="name" name="_systemfield_name" required></label>
<label>Email<input id="email" name="_systemfield_email" type="email" required></label>
<label>Resume<input id="resume" name="_systemfield_resume" type="file"></label>
<label>Why do you want to work here?<textarea id="why" name="why" maxlength="500"></textarea></label>
<label>Leave this field blank<input id="beeCatcher" name="beeCatcher"></label>
<button type="button" id="submit-application">Submit Application</button>
</form>
</body></html>
