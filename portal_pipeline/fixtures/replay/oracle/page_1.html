<!doctype html><html><head><meta charset="utf-8"><meta name="author" content="Yazad Madan"><title>Synthetic Oracle form</title></head><body>
<h1>Personal Information</h1>
<form id="synthetic-oracle" novalidate>
<label>First name<input id="first-name" name="firstName" required></label>
<label>Last name<input id="last-name" name="lastName" required></label>
<label>Email<input id="email" name="email" type="email" required></label>
<label>Leave this field blank<input id="beeCatcher" name="beeCatcher"></label>
<button type="button" id="next">Next</button>
</form>
</body></html>
