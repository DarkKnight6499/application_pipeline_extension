<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Synthetic Greenhouse application</title>
<style>body{font:16px system-ui;max-width:760px;margin:30px auto}label,.file-upload{display:block;margin:16px 0}input{display:block;padding:8px}.visually-hidden{display:none}.file-upload{padding:12px;border:1px solid #aaa}</style></head>
<body><h1>Synthetic hosted application</h1><p>Structural fixture derived from public form observations. No employer endpoint or candidate data.</p>
<label>Newsletter Email<input id="newsletter" value="KEEP NEWSLETTER"></label>
<form id="application-form" class="application--form">
<div class="application--questions">
<label for="first_name">First Name *</label><input id="first_name" aria-label="First Name" aria-required="true" type="text" maxlength="255">
<label for="last_name">Last Name *</label><input id="last_name" aria-label="Last Name" aria-required="true" type="text" maxlength="255">
<label for="email">Email *</label><input id="email" aria-label="Email" aria-required="true" type="text" maxlength="255">
<label for="phone">Phone *</label><input id="phone" aria-label="Phone" aria-required="true" type="tel" value="KEEP PHONE">
<div class="select"><label id="country-label" for="country">Country *</label><input class="select__input" id="country" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="country-label" aria-required="true"><input id="required-shadow" required tabindex="-1" aria-hidden="true" value="KEEP SHADOW"></div>
<div class="select"><label id="candidate-location-label" for="candidate-location">Location (City) *</label><input class="select__input" id="candidate-location" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="candidate-location-label"></div>
<div class="file-upload" role="group" aria-labelledby="upload-label-resume" aria-required="true"><div id="upload-label-resume" class="label upload-label">Resume/CV<span>*</span></div><div class="file-upload__wrapper"><button type="button" id="attach">Attach</button><label for="resume" class="visually-hidden">Attach</label><input id="resume" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf"></div></div>
<div class="file-upload" role="group" aria-labelledby="upload-label-cover_letter"><div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div><div class="file-upload__wrapper"><button type="button">Attach</button><label for="cover_letter" class="visually-hidden">Attach</label><input id="cover_letter" class="visually-hidden" type="file"></div></div>
<label for="linkedin">LinkedIn Profile *</label><input id="linkedin" type="text">
<label for="compound">Will you now or in the future require sponsorship?</label><input id="compound" role="combobox" type="text" aria-expanded="false" aria-autocomplete="list">
</div>
<div id="demographic-section" class="demographic--container"><h2>Voluntary survey</h2><label for="transgender">Would you describe yourself as transgender?</label><input id="transgender" role="combobox" aria-expanded="false" type="text"><label for="survey-education">Degree</label><input id="survey-education" type="text"></div>
<label>Signature<input id="signature"></label><button type="submit" id="submit">Submit application</button>
</form><p id="uploads">No remote upload has occurred.</p>
<script>globalThis.submitAttempts=0;document.getElementById('application-form').onsubmit=event=>{event.preventDefault();globalThis.submitAttempts++};document.getElementById('resume').onchange=()=>{document.getElementById('uploads').textContent='Synthetic file input changed. This is not a remote upload completion indicator.'};</script>
</body></html>
