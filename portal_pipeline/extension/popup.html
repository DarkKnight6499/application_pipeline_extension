<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pair portal prototype</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>Portal prototype</h1><p>Inspect a Workday or Greenhouse page without pairing. To fill selected fields, start the dashboard and import an audited application.</p>
<label>Server<input id="server" value="http://127.0.0.1:8766"></label>
<label>Pairing token<input id="token" type="password" autocomplete="off"></label>
<button id="pair" type="button">Save pairing</button><button id="inspect" type="button">Inspect page only</button><button id="scan" type="button">Scan current page</button>
<p id="status" role="status"></p><script src="popup.js"></script></body></html>
